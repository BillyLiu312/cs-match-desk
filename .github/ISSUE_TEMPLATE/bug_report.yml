name: Bug report
description: Report a reproducible problem in CS Match Desk
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CS Match Desk. Do not include cookies, credentials, or private data.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.4
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: App version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the menu bar panel
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots or non-sensitive logs are useful.
