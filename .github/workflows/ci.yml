name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Run model checks
        run: ./scripts/test.sh

      - name: Build application
        run: ./scripts/build-app.sh

      - name: Build development application
        run: ./scripts/build-app.sh debug

      - name: Verify bundles and icon resources
        run: |
          app="build/CS Match Desk.app"
          test -x "$app/Contents/MacOS/CSMatchBar"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          for icon in AppIcon.icns MenuBarIcon@2x.png HeaderIcon@2x.jpg; do
            cmp "Resources/$icon" "$app/Contents/Resources/$icon"
          done
          diff -qr Resources/OriginalTeamLogos "$app/Contents/Resources/TeamLogos"
          diff -qr Resources/DarkTeamLogos "$app/Contents/Resources/TeamLogosDark"
          test "$(find build -type d -name '*.app' | wc -l | tr -d ' ')" -eq 1
