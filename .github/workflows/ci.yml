name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run model checks
        run: ./scripts/test.sh

      - name: Build application
        run: ./scripts/build-app.sh

      - name: Verify bundle
        run: |
          test -x "build/CS Match Desk.app/Contents/MacOS/CSMatchBar"
          plutil -lint "build/CS Match Desk.app/Contents/Info.plist"
          codesign --verify --deep --strict "build/CS Match Desk.app"
