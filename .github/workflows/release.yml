name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Run checks
        run: ./scripts/test.sh

      - name: Build release application
        run: ./scripts/build-app.sh release

      - name: Package application
        id: package
        run: |
          archive="$RUNNER_TEMP/CS-Match-Desk-${GITHUB_REF_NAME}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/CS Match Desk.app" "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CS Match Desk $GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.package.outputs.archive }}"
